name: Notify translation curators

on:
  push:
    branches:
      - dev
      - master
    paths:
      - docs/source/**
      - docs/mkdocs.yml
      - docs/site.json
      - docs/scripts/**
      - .github/workflows/docs.yml
  pull_request:
    branches:
      - dev
      - master
    paths:
      - docs/source/**
      - docs/mkdocs.yml
      - docs/site.json
      - docs/scripts/**
      - .github/workflows/docs.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Preview the report or publish it
        required: true
        type: choice
        default: preview
        options:
          - preview
          - publish
      base:
        description: Git revision to compare with the selected workflow ref
        required: true
        type: string
        default: master

permissions:
  contents: read
  discussions: write

jobs:
  notify:
    if: >-
      github.repository == 'Lint-Free-Technology/uix' &&
      (github.event_name == 'push' || inputs.mode != 'publish' ||
      github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'push' && 'publish' || github.event_name == 'pull_request' && 'preview' || inputs.mode }}
      BASE: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base }}
      HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD }}
      - name: Render notification
        id: report
        run: |
          report="$RUNNER_TEMP/translation-update.md"
          if [[ "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse "$GITHUB_SHA^")"
          fi
          if ! git rev-parse --verify --quiet "$BASE^{commit}"; then
            BASE="origin/$BASE"
          fi
          BASE="$(git rev-parse "$BASE^{commit}")"
          arguments=(
            --base "$BASE"
            --head "$HEAD"
            --repository "$GITHUB_REPOSITORY"
            --branch "$BRANCH"
            --output "$report"
            --github-output "$GITHUB_OUTPUT"
          )
          python docs/scripts/translation_updates.py "${arguments[@]}"
          echo "report=$report" >> "$GITHUB_OUTPUT"
      - name: Skip live notification without subscribers
        if: >-
          env.MODE == 'publish' && steps.report.outputs.has_changes == 'true' &&
          steps.report.outputs.has_curators != 'true'
        run: >-
          echo 'No registered translation curators; skipped the live Discussion post.'
          >> "$GITHUB_STEP_SUMMARY"
      - name: Select target Discussion
        id: target
        if: >-
          steps.report.outputs.has_changes == 'true' &&
          env.MODE == 'publish' && steps.report.outputs.has_curators == 'true'
        env:
          LIVE_DISCUSSION_ID: ${{ vars.TRANSLATION_UPDATES_DISCUSSION_ID }}
        run: |
          discussion_id="$LIVE_DISCUSSION_ID"
          if [[ -z "$discussion_id" ]]; then
            echo "Configured Discussion ID is missing." >&2
            exit 1
          fi
          echo "discussion_id=$discussion_id" >> "$GITHUB_OUTPUT"
      - name: Add Discussion comment
        if: steps.target.outputs.discussion_id != ''
        uses: actions/github-script@v9
        env:
          DISCUSSION_ID: ${{ steps.target.outputs.discussion_id }}
          REPORT: ${{ steps.report.outputs.report }}
        with:
          script: |
            const { readFileSync } = require("node:fs");
            const body = readFileSync(process.env.REPORT, "utf8");
            await github.graphql(
              `mutation ($discussionId: ID!, $body: String!) {
                addDiscussionComment(
                  input: {discussionId: $discussionId, body: $body}
                ) {
                  comment { url }
                }
              }`,
              {
                discussionId: process.env.DISCUSSION_ID,
                body,
              },
            );
      - name: Write preview summary
        if: env.MODE == 'preview' && steps.report.outputs.has_changes == 'true'
        run: cat "${{ steps.report.outputs.report }}" >> "$GITHUB_STEP_SUMMARY"
