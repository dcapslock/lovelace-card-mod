# Do not remove comments marked UIX_RELEASE_*: the documentation release workflow uses them as markers.
site_name: UI eXtension
site_url: https://uix.lf.technology # UIX_RELEASE_SITE_URL
docs_dir: source # UIX_RELEASE_DOCS_DIR
theme:
  name: material
  language: en # UIX_RELEASE_LANGUAGE
  variant: classic
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.expand
    - toc.integrate
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - schema: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: assets/images/icon.png
  favicon: assets/images/icon.png
  custom_dir: overrides
extra:
  generator: false
  # Replaced in docs/mkdocs.release.yml by docs/scripts/prepare_release.py.
  alternate: [] # UIX_RELEASE_ALTERNATES
copyright: 'Documentation licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>' # UIX_RELEASE_COPYRIGHT
plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.blocks.caption
  - attr_list
  - md_in_html
  - zensical.extensions.glightbox
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - UI eXtension:
       - About: index.md
       - Quick Start: /quick-start
       - UIX Styling: /using
       - UIX Forge: /forge
       - UIX Broker: /broker
       - UIX Extras: /extras
       - UIX Guides: /guides
       - FAQ: /faq
       - Contributing: /contributing
       - License: /license
  - Quick Start: 'quick-start.md'
  - UIX Styling:
      -  Styling:
          - using/index.md
          - using/cards.md
          - using/entities.md
          - using/icons.md
          - using/images.md
          - using/section-backgrounds.md
          - using/view-backgrounds.md
          - using/custom-panels.md
          - using/templates.md
          - using/themes.md
          - using/other.md
      - Concepts:
          - concepts/index.md
          - concepts/dom.md
          - concepts/application.md
      - Debugging:
          - debugging/index.md
          - debugging/cards.md
          - debugging/templates.md
          - debugging/cache.md
      - Developers:
          - developers/index.md
          - developers/cards.md
          - developers/themes.md
  - UIX Forge:
      - forge/index.md
      - forge/forge.md
      - forge/foundries.md
      - Sparks:
          - forge/sparks/index.md
          - forge/sparks/tooltip.md
          - forge/sparks/button.md
          - forge/sparks/attribute.md
          - forge/sparks/event.md
          - forge/sparks/tile-icon.md
          - forge/sparks/state-badge.md
          - forge/sparks/grid.md
          - forge/sparks/search.md
          - forge/sparks/map.md
          - forge/sparks/lock.md
          - forge/sparks/more-info.md
          - forge/sparks/overlay-icon.md
          - forge/sparks/background.md
          - forge/sparks/theme.md
  - UIX Broker:
      - broker/index.md
      - broker/broker.md
      - broker/realms.md
      - broker/interaction-anchors.md
      - broker/rules.md
      - broker/directives.md
      - broker/examples.md
  - UIX Extras:
      - extras/index.md
      - extras/uix-actions.md
      - extras/frontend-states-throttling.md
      - extras/dialog-styling-delay.md
      - extras/hash-template-variable-updates.md
      - extras/disable-icon-styling.md
      - extras/disable-entity-picture-image-override.md
      - extras/always-patch-ha-card.md
      - extras/style-custom-panels.md
  - UIX Guides: 'guides.md'
  - FAQ: 'faq.md'
repo_url: https://github.com/Lint-Free-Technology/uix
repo_name: GitHub
edit_uri: blob/master/docs/source/
extra_css:
  - stylesheets/extra.css #https://maketintsandshades.com/#colors=CE3226&hashtag=0&steps=10
