homeassistant:
  country: US
  unit_system: metric
  time_zone: UTC
  customize: !include customize.yaml
  media_dirs:
    local: /config/www/media

default_config:

demo:

lovelace:
  mode: storage
  resource_mode: yaml
  resources: !include lovelace_resources.yaml

frontend:
  themes: !include themes.yaml

panel_custom:
  - name: test-custom-panel
    # url_path needs to be unique for each panel_custom config
    url_path: test-custom-panel
    module_url: /local/test-custom-panel.js
    embed_iframe: true
    config:
      # Data you want to make available to panel
      hello: world

input_boolean:
  test_boolean:
    name: Test Boolean
    initial: off
  festive_day:
    name: Festive Day
    initial: off

input_number:
  test_number:
    name: Test Number
    initial: 1
    min: 1
    max: 100
    step: 1

person:
  - name: James Bond 007
    id: james_bond007

light:
  - platform: group
    unique_id: uix_group_all_lights
    name: "All Lights"
    entities:
      - light.bed_light
      - light.ceiling_lights
      - light.kitchen_lights
      - light.living_room_rgbww_lights
      - light.office_rgbw_lights
      - light.entrance_color_white_lights

zone:
  - name: London
    latitude: 51.5200
    longitude: -0.1300
    radius: 1000
    passive: false

# Template entities
# device_tracker template entities are used to simulate device_tracker entities for testing purposes.
# sensors for extra temperature sensors
template:
  - triggers:
    - trigger: webhook     
      webhook_id: uix_device_tracker_tablet
      allowed_methods:
        - POST
        - PUT 
    device_tracker:
      - name: tablet
        longitude: "{{ trigger.json.longitude }}"
        latitude: "{{ trigger.json.latitude }}"
        location_accuracy: "{{ trigger.json.resolution }}"
  - triggers:
    - trigger: webhook     
      webhook_id: uix_device_tracker_phone
      allowed_methods:
        - POST
        - PUT 
    device_tracker:
      - name: phone
        longitude: "{{ trigger.json.longitude }}"
        latitude: "{{ trigger.json.latitude }}"
        location_accuracy: "{{ trigger.json.resolution }}"
  - triggers:
    - trigger: webhook     
      webhook_id: uix_device_tracker_uix_test_person
      allowed_methods:
        - POST
        - PUT 
    device_tracker:
      - name: uix_test_person  
        longitude: "{{ trigger.json.longitude }}"
        latitude: "{{ trigger.json.latitude }}"
        location_accuracy: "{{ trigger.json.resolution }}"
  - triggers:
    - trigger: webhook     
      webhook_id: uix_device_tracker_uix_test_person_slider
      allowed_methods:
        - POST
        - PUT 
    device_tracker:
      - name: uix_test_person_slider
        longitude: "{{ trigger.json.longitude }}"
        latitude: "{{ trigger.json.latitude }}"
        location_accuracy: "{{ trigger.json.resolution }}"
  - triggers:
    - trigger: webhook     
      webhook_id: uix_device_tracker_uix_tracker_one
      allowed_methods:
        - POST
        - PUT 
    device_tracker:
      - name: uix_tracker_one
        longitude: "{{ trigger.json.longitude }}"
        latitude: "{{ trigger.json.latitude }}"
        location_accuracy: "{{ trigger.json.resolution }}"
  - triggers:
    - trigger: webhook     
      webhook_id: uix_device_tracker_uix_tracker_two
      allowed_methods:
        - POST
        - PUT 
    device_tracker:
      - name: uix_tracker_two
        longitude: "{{ trigger.json.longitude }}"
        latitude: "{{ trigger.json.latitude }}"
        location_accuracy: "{{ trigger.json.resolution }}"
  - sensor:
      - name: Sauna Temperature
        state: 75
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Basement Temperature
        state: 12
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Attic Temperature
        state: 8
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: Kitchen Temperature
        state: 22
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement