# HA theme definitions used by UIX visual tests.
#
# Each theme is available via the ``frontend.set_theme`` service call and
# is referenced by the ``theme:`` key in a scenario YAML file.

uix-test-theme:
  uix-theme: uix-test-theme
  uix-card: |
    ha-card {
      background: rgb(0, 0, 128) !important;
      color: white !important;
    }

uix-more-info-theme:
  uix-theme: uix-more-info-theme
  uix-more-info-yaml: |
    ha-more-info-info $: |
      more-info-content {
        --uix-test-more-info-theme: applied;
      }

# ---------------------------------------------------------------------------
# Documentation image themes — used by scenarios under
# tests/visual/scenarios/doc-images/ to generate the page-asset PNGs
# referenced in docs/source/using/themes.md.
# ---------------------------------------------------------------------------

uix-doc-red-basic:
  uix-theme: uix-doc-red-basic
  primary-text-color: red
  ha-card-border-radius: 20px

uix-doc-row-red:
  uix-theme: uix-doc-row-red
  uix-row-yaml: |
    hui-generic-entity-row $: |
      .info{
        color: red;
      }

uix-doc-row-blue-override:
  uix-theme: uix-doc-row-blue-override
  uix-row-yaml: |
    hui-generic-entity-row $: |
      .info{
        color: blue;
      }

uix-doc-red-border:
  uix-theme: uix-doc-red-border
  primary-text-color: red
  ha-card-border-radius: 20px
  uix-row: |
    :host {
      display: block;
      border: 1px solid black;
    }

uix-doc-red-template:
  uix-theme: uix-doc-red-template
  primary-text-color: red
  ha-card-border-radius: 20px
  uix-row: |
    :host {
      display: block;
      border: 1px solid {% if is_state(config.entity, 'on') %} red {% else %} black {% endif %};
    }

uix-test-view-bg-image:
  uix-theme: uix-test-view-bg-image
  uix-drawer: |
    :host {
      --uix-view-background-image: /local/media/person-grey.png;
    }

uix-test-view-bg-shorthand:
  uix-theme: uix-test-view-bg-shorthand
  uix-drawer: |
    :host {
      --uix-view-background: linear-gradient(135deg, teal 0%, purple 100%);
    }

uix-doc-red-classes:
  uix-theme: uix-doc-red-classes
  primary-text-color: red
  ha-card-border-radius: 20px
  uix-row: |
    :host {
      display: block;
      border: 1px solid {% if is_state(config.entity, 'on') %} red {% else %} black {% endif %};
    }
    :host(.teal) {
      background: teal;
    }
    :host(.purple) {
      background: purple;
    }

uix-date-picker-selection:
  uix-theme: uix-date-picker-selection

  uix-dialog-yaml: |
    "&.type-dialog-date-picker": |
      calendar-month::part(range-inner),
      calendar-month::part(range-start),
      calendar-month::part(range-end),
      calendar-month::part(selected),
      calendar-month::part(selected):hover,
      calendar-month:not(.dummy)::part(button selected):hover {
        background-color: red !important;
      }
      calendar-month::part(button):hover {
        background-color: rgba(255, 0, 0, 0.2) !important;
      }

uix-global-blue:
  uix-theme: uix-global-blue
  primary-color: "#0000ff"
  uix-card: |
    ha-card {
      background-color: rgb(0, 0, 255) !important;
    }

uix-local-orange:
  uix-theme: uix-local-orange
  primary-color: "#ff7a00"
  uix-card: |
    ha-card {
      background-color: rgb(255, 122, 0) !important;
    }
  uix-more-info: |
    ha-more-info-info {
      --uix-test-more-info-theme: applied;
    }

uix-local-orange-alias:
  # Use this theme's Home Assistant variables while keeping UIX styles in
  # uix-local-orange.
  uix-theme: uix-local-orange
  primary-color: "#ff7a00"

uix-global-green:
  uix-theme: uix-global-green
  primary-color: "#00aa00"
  uix-card: |
    ha-card {
      background-color: rgb(0, 170, 0) !important;
    }

uix-card-as-badge:
  uix-theme: uix-card-as-badge

  uix-card-as-badge-yaml: |
    .: |
      :host {
        --ha-tile-info-primary-font-size: var(--ha-font-size-s);
        --ha-card-border-radius: var(--ha-badge-border-radius, calc(var(--ha-badge-size, 36px) / 2));
      }
    hui-home-summary-card $: |
      ha-tile-container {
        line-height: 0;
      }
      ha-tile-icon {
        --mdc-icon-size: 18px;
        --tile-icon-size: 18px;
      }
    hui-home-summary-card $ ha-tile-info $: |
      div.info {
        flex-direction: row;
        align-items: center;
        gap: var(--ha-space-2);
      }
      div.info slot.primary span,
      div.info slot.secondary span {
          overflow: visible;
        }
    hui-home-summary-card $$ ha-tile-container $: |
      .container {
        margin: 0;
      }
      .content {
        gap: var(--ha-space-2) !important;
        padding: 8px 10px !important;
        min-height: unset !important;
      }

uix-doc-spark-theme-template-blue:
  primary-text-color: blue
  ha-card-border-radius: 20px
  ha-card-background: lightpink
  
uix-doc-spark-theme-template-red:
  primary-text-color: red
  ha-card-border-radius: 20px
  ha-card-background: antiquewhite

uix-doc-styling-theme-template:
  uix-theme: uix-doc-styling-theme-template

  uix-macros-yaml: |
    is_on:
      params:
        - entity_id
      returns: true
      template: "{%- do returns(is_state(entity_id, 'on')) -%}"
    badge_color:
      params:
        - entity_id
        - name: color_on
          default: "'var(--state-active-color)'"
        - name: color_off
          default: "'var(--state-inactive-color)'"
      template: "{{ color_on if is_on(entity_id) else color_off }}"

uix-forge-spark-more-info-weather:
  uix-theme: uix-forge-spark-more-info-weather
  uix-more-info-yaml: |
    ha-more-info-info $$ more-info-weather $: |
      div.forecast-item-label {
        font-weight: bold;
      }
      div.temp,
      div.forecast-item div.temp {
        color: red;
      }
      div.forecast-item div.templow {
        color: blue;
      }

uix-forge-spark-more-info-padding:
  uix-theme: uix-forge-spark-more-info-padding
  uix-more-info-yaml: |
    .: |
      :host {
        --uix-more-info-details-outer-padding: 0 var(--ha-space-3) var(--ha-space-3);
      }
    ha-more-info-info $: |
      div.content {
        padding: var(--ha-space-3);
      }

uix-forge-spark-more-info-details-padding:
  uix-theme: uix-forge-spark-more-info-details-padding
  uix-more-info-yaml: |
    .: |
      :host {
        --uix-more-info-details-head-padding: 0 var(--ha-space-3);
      }
    ha-more-info-details $: |
      div.content {
        padding: 0 var(--ha-space-3) var(--ha-space-3);
      }

uix-test-custom-card:
  uix-theme: uix-test-custom-card
  uix-card: |
    b {
      color: orange;
    }

uix-theme-css-vars-template:
  uix-theme: uix-theme-css-vars-template

  uix-drawer: |
    :host {
      {% set isDark = is_state('sun.sun','below_horizon') %}
      --darkslateblue-if-dark: {{ 'darkslateblue' if isDark else 'red' }};
      --slategrey-if-dark: {{ 'slategrey' if isDark else 'green' }};
      --yellow-if-not-dark: {{ 'yellow' if not isDark else 'pink' }};
      --orange-if-not-dark: {{ 'orange' if not isDark else 'purple' }};
    }

uix-icon-for-entity-theme:
  uix-theme: uix-icon-for-entity-theme
  uix-macros-yaml: |
    temp_icon_color:
      params:
        - entity_id
      template: >
        {% set entityString = entity_id.replace('.','_') %}
        --uix-icon-for-{{ entityString }}: mdi:thermometer-bluetooth;
        --uix-icon-color-for-{{ entityString }}:
        {%- set raw = states(entity_id) -%}
        {%- if raw in ['unknown', 'unavailable', 'none'] -%} gray;
        {%- else -%}
        {%- set state = raw|float(-5) -%}
        {%- if state < 5 -%} dodgerblue
        {%- elif state < 10 -%} lightblue
        {%- elif state < 15 -%} turquoise
        {%- elif state < 20 -%} green
        {%- elif state < 25 -%} darkgreen
        {%- elif state < 30 -%} orange
        {%- elif state < 35 -%} crimson
        {%- else -%} firebrick
        {%- endif -%};
        {%- endif -%}
    temp_icon_color_for_all:
      template: >
        {% set entities = ['sensor.outside_temperature'] %}
        {% for entity in entities %}
          {{ temp_icon_color(entity) }}
        {% endfor %}

  uix-root-yaml: |
    .: |
      :host {
        {{ temp_icon_color_for_all() }}
      }
  
  uix-more-info-yaml: |
    .: |
      :host {
        {{ temp_icon_color_for_all() }}
      }
    "ha-more-info-info $": |
      div.container div.content ha-more-info-history {
        display: none;
      }

uix-doc-icon-for-entity-theme:
  uix-theme: uix-doc-icon-for-entity-theme
  uix-macros-yaml: |
    temp_icon_color:
      params:
        - entity_id
      template: >
        {%- set entityString = entity_id.replace('.','_') -%}
        --uix-icon-for-{{ entityString }}: mdi:thermometer-bluetooth;
        --uix-icon-color-for-{{ entityString }}:
        {%- set raw = states(entity_id) -%}
        {%- if raw in ['unknown', 'unavailable', 'none'] -%} gray;
        {%- else -%}
        {%- set state = raw|float(-5) -%}
        {%- if state < 5 -%} dodgerblue
        {%- elif state < 10 -%} lightblue
        {%- elif state < 15 -%} turquoise
        {%- elif state < 20 -%} green
        {%- elif state < 25 -%} darkgreen
        {%- elif state < 30 -%} orange
        {%- elif state < 35 -%} crimson
        {%- else -%} firebrick
        {%- endif -%};
        {%- endif -%}
    temp_icon_color_all:
      template: >
        {% set entities = states.sensor 
          | selectattr('attributes.device_class', 'defined') 
          | selectattr('attributes.device_class', 'eq', 'temperature') 
          | selectattr('attributes.state_class', 'defined')
          | selectattr('attributes.state_class', 'eq', 'measurement')
          | map(attribute='entity_id') | list %}
        {% for entity in entities %}
          {{ temp_icon_color(entity) }}
        {% endfor %}

  uix-root-yaml: |
    .: |
      :host {
        {{ temp_icon_color_all() }}
      }
  
  uix-more-info-yaml: |
    .: |
      :host {
        {{ temp_icon_color_all() }}
      }

uix-image-for-entity-theme:
  uix-theme: uix-image-for-entity-theme
  uix-macros-yaml: |
    image_person_james_bond:
      template: >
        {% if is_state('person.james_bond_007', 'unknown') %}
          --uix-image-for-person_james_bond_007: /local/media/question_mark_cropped.jpg;
        {% else %}
          --uix-image-for-person_james_bond_007: /local/media/daniel_craig_cropped.jpg;
        {% endif %}

  uix-root-yaml: |
    .: |
      :host {
        {{ image_person_james_bond() }}
      }
  
  uix-more-info-yaml: |
    .: |
      :host {
        {{ image_person_james_bond() }}
      }

uix-stacked-toast-theme:
  uix-theme: uix-stacked-toast-theme
  uix-toast-yaml: |
    $: |
      {% if 'id' in params and params.id == 'toast-message-1' %}
      div.toast {
        background: rgb(206, 50, 38);
        color: white;
      }
      {% endif %}

uix-custom-panel-theme:
  primary-background-color: "white"
  sidebar-background-color: "white"

  uix-theme: uix-custom-panel-theme
  uix-test-custom-panel-yaml: |
    .: |
      :host::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: gray;
      }
      wired-card {
        background: {{ 'red' if is_state('input_boolean.test_boolean', 'on') else 'gray' }} !important;
        color: white !important;
      }
    wired-card $: |
      div#overlay {
        color: yellow;
        box-shadow: 0 0 10px 5px yellow;
      }