uix_broker:
  - realm: browser
    listen:
      - uix-broker-ready
      - uix-update-sidebar
    anchor: "&home-assistant $ home-assistant-main $ ha-sidebar"
    directives:
      - type: button
        anchor: "$ div.panels-list div.wrapper ha-list-nav slot ha-list-item-button#sidebar-panel-home $ a#item div.content"
        icon: mdi:hammer
        color: purple
        size: s
        tap_action:
          action: navigate
          navigation_path: /config/tools
        style:
          "--ha-button-box-shadow": rgba(0, 0, 0, 0.1) 0px 4px 12px
          "--ha-icon-button-size": "32px"
          "--uix-icon-button-background-opacity": "0.08"
          "--uix-button-border-color": "currentColor"
          "--uix-button-margin": "6px"
          z-index: 1
      - type: tooltip
        for: previous
        content: "Go to tools"
        placement: top
        trigger: hover focus
        hide_delay: 20000
        style:
          "--uix-tooltip-border-color": "rgba(0, 0, 0, 0.8)"
          "--uix-tooltip-border-style": "solid"
          "--uix-tooltip-border-width": "1px"
  - realm: browser
    listen:
      - uix-broker-ready
      - uix-update-sidebar
    anchor: "&home-assistant $ home-assistant-main $ ha-sidebar"
    directives:
      - type: button
        anchor: "$ div.panels-list div.wrapper ha-list-nav slot ha-list-item-button#sidebar-panel-energy $ a#item div.content"
        icon: mdi:hammer
        color: red
        size: s
        tap_action:
          action: navigate
          navigation_path: /config/tools
        style:
          "--ha-button-box-shadow": rgba(0, 0, 0, 0.1) 0px 4px 12px
          "--ha-icon-button-size": "32px"
          "--uix-icon-button-background-opacity": "0.08"
          "--uix-button-border-color": "currentColor"
          "--uix-button-margin": "6px"
          z-index: 1
      - type: tooltip
        for: previous
        content: "Go to tools"
        placement: bottom
        trigger: manual
        open: true
        without_arrow: true
        hide_delay: 20000
        style:
          "--uix-tooltip-background-color": "rgba(255, 0, 0, 0.8)"
          "--uix-tooltip-content-color": "white"
