# Third-party Lovelace plugins to download on every HA instance startup.
#
# Each entry requires:
#   repo     - GitHub repository in "owner/name" format
#   asset    - name of the JS asset to download from the latest release
#   filename - filename to write inside www/ (usually the same as `asset`)
#
# Resolution order: release asset → repo root → dist/ folder.

- repo: Lint-Free-Technology/lovelace-auto-entities
  asset: auto-entities.js
  filename: auto-entities.js

- repo: Nerwyn/custom-card-features
  asset: custom-card-features.min.js
  filename: custom-card-features.min.js

- repo: selvalt7/badge-horizontal-container-card
  asset: badge-horizontal-container-card.js
  filename: badge-horizontal-container-card.js

- repo: Lint-Free-Technology/lovelace-template-entity-row
  asset: template-entity-row.js
  filename: template-entity-row.js

- repo: MelleD/lovelace-expander-card
  asset: expander-card.js
  filename: expander-card.js

- local_path: ./test-custom-card/dist/my-awesome-card.js
  filename: my-awesome-card.js

- local_path: ./test-custom-panel/test-custom-panel.js
  filename: test-custom-panel.js

- repo: artem-sedykh/mini-climate-card
  asset: mini-climate-card-bundle.js
  filename: mini-climate-card-bundle.js