id: forge_tooltip
description: "Tooltip spark attaches a wa-tooltip containing the configured text"
view_path: forge-tooltip

setup:
  - type: ha_service
    domain: light
    service: turn_on
    data:
      entity_id: light.bed_light
      brightness: 181
      color_temp_kelvin: 2631

card:
  type: "custom:uix-forge"
  forge:
    mold: card
    sparks:
      - type: tooltip
        for: hui-tile-card
        content: "This is a UIX tooltip"
        trigger: hover focus
  element:
    type: tile
    entity: "light.bed_light"

# Hover the forge card to trigger the tooltip before taking the snapshot.
interactions:
  - type: hover
    selector: uix-forge
    settle_ms: 800
  # Regression: Web Awesome 3.7 hides on this transition because its :hover
  # check races when the pointer enters slotted tooltip content.
  - type: hover
    root: uix-forge
    selector: div[data-uix-tooltip-content]
    settle_ms: 300

assertions:
  - type: element_present
    root: uix-forge
    selector: wa-tooltip

  # wa-tooltip.textContent includes UIX-injected scoped CSS after the user
  # text, so we check it starts with the configured content.
  - type: text_startswith
    root: uix-forge
    selector: wa-tooltip
    expected: "This is a UIX tooltip"

  - type: object_property_text_equals
    root: uix-forge
    selector: wa-tooltip
    property: open
    expected: "true"

  # UIX owns the configured hover trigger while Web Awesome retains focus.
  - type: object_property_text_equals
    root: uix-forge
    selector: wa-tooltip
    property: trigger
    expected: focus

  # Snapshot is taken after hover so the tooltip is visible.
  - type: snapshot
    name: "04_forge_tooltip_spark"
    threshold: 0.02
